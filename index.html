<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz de banderas</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mut:#6b7488;--ac:#3b6cf6;--ok:#1f9d55;--okbg:#dcf5e6;--ko:#d93a3a;--kobg:#fbe0e0;--bd:#dde2ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151d;--card:#1c2130;--tx:#eef1f8;--mut:#98a2b8;--ac:#6b93ff;--ok:#4cd98a;--okbg:#17382a;--ko:#ff7b7b;--kobg:#3d1f22;--bd:#2b3247;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151d;--card:#1c2130;--tx:#eef1f8;--mut:#98a2b8;--ac:#6b93ff;--ok:#4cd98a;--okbg:#17382a;--ko:#ff7b7b;--kobg:#3d1f22;--bd:#2b3247;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:460px;padding:20px;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center}
h1{margin:0;font-size:1.8rem}
p{margin:0;color:var(--mut)}
.flag{font-size:min(38vw,170px);line-height:1.1;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px 0;font-family:"Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",sans-serif}
.top{display:flex;justify-content:space-between;color:var(--mut);font-weight:600}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
button{font:inherit;font-size:1.1rem;font-weight:600;padding:16px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;width:100%}
button:active{transform:scale(.98)}
button.main{background:var(--ac);border-color:var(--ac);color:#fff}
button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
button.ko{background:var(--kobg);border-color:var(--ko);color:var(--ko)}
button small{display:block;font-weight:400;color:var(--mut);font-size:.85rem;margin-top:2px}
.opts{display:flex;flex-direction:column;gap:10px}
.big{font-size:4rem;font-weight:800;color:var(--ac)}
.hide{display:none}
.late{color:var(--ko)}
</style>
</head>
<body>
<div id="app"></div>
<script>
// * = fácil (muy conocidos), + = medio, sin marca = difícil
const D={
"Europa":"*ES=España,*FR=Francia,*DE=Alemania,*IT=Italia,*PT=Portugal,*GB=Reino Unido,*IE=Irlanda,*NL=Países Bajos,*BE=Bélgica,*CH=Suiza,*AT=Austria,*SE=Suecia,*NO=Noruega,*DK=Dinamarca,*FI=Finlandia,*PL=Polonia,*GR=Grecia,*UA=Ucrania,*RU=Rusia,*HU=Hungría,*CZ=Chequia,*RO=Rumanía,*HR=Croacia,+IS=Islandia,+RS=Serbia,+BG=Bulgaria,+SK=Eslovaquia,+SI=Eslovenia,+LT=Lituania,+LV=Letonia,+EE=Estonia,+BY=Bielorrusia,LU=Luxemburgo,MT=Malta,AL=Albania,BA=Bosnia y Herzegovina,ME=Montenegro,MK=Macedonia del Norte,MD=Moldavia,AD=Andorra,MC=Mónaco,SM=San Marino,LI=Liechtenstein,VA=Ciudad del Vaticano,CY=Chipre",
"América":"*US=Estados Unidos,*CA=Canadá,*MX=México,*CU=Cuba,*CO=Colombia,*VE=Venezuela,*PE=Perú,*CL=Chile,*AR=Argentina,*BR=Brasil,*UY=Uruguay,*BO=Bolivia,*EC=Ecuador,*JM=Jamaica,+PY=Paraguay,+PA=Panamá,+CR=Costa Rica,+DO=República Dominicana,+GT=Guatemala,+HN=Honduras,+NI=Nicaragua,+SV=El Salvador,+HT=Haití,BS=Bahamas,BB=Barbados,BZ=Belice,GY=Guyana,SR=Surinam,TT=Trinidad y Tobago,LC=Santa Lucía,GD=Granada,VC=San Vicente y las Granadinas,AG=Antigua y Barbuda,DM=Dominica,KN=San Cristóbal y Nieves",
"Asia":"*JP=Japón,*CN=China,*KR=Corea del Sur,*IN=India,*TH=Tailandia,*VN=Vietnam,*ID=Indonesia,*TR=Turquía,*SA=Arabia Saudí,*IL=Israel,*IR=Irán,*PH=Filipinas,*PK=Pakistán,+KP=Corea del Norte,+IQ=Irak,+SY=Siria,+AF=Afganistán,+BD=Bangladés,+MY=Malasia,+SG=Singapur,+AE=Emiratos Árabes Unidos,+QA=Catar,+JO=Jordania,+LB=Líbano,+KZ=Kazajistán,+NP=Nepal,+LK=Sri Lanka,+MN=Mongolia,KW=Kuwait,BH=Baréin,OM=Omán,YE=Yemen,UZ=Uzbekistán,TM=Turkmenistán,KG=Kirguistán,TJ=Tayikistán,AZ=Azerbaiyán,AM=Armenia,GE=Georgia,BT=Bután,MM=Birmania,KH=Camboya,LA=Laos,BN=Brunéi,TL=Timor Oriental,MV=Maldivas",
"África":"*EG=Egipto,*MA=Marruecos,*ZA=Sudáfrica,*NG=Nigeria,*KE=Kenia,*DZ=Argelia,*SN=Senegal,*GH=Ghana,+TN=Túnez,+LY=Libia,+ET=Etiopía,+TZ=Tanzania,+UG=Uganda,+CM=Camerún,+CI=Costa de Marfil,+AO=Angola,+SD=Sudán,+ZW=Zimbabue,+MG=Madagascar,ML=Malí,NE=Níger,TD=Chad,BF=Burkina Faso,MR=Mauritania,GN=Guinea,GW=Guinea-Bisáu,GQ=Guinea Ecuatorial,SL=Sierra Leona,LR=Liberia,TG=Togo,BJ=Benín,GA=Gabón,CG=Congo,CD=República Democrática del Congo,CF=República Centroafricana,SS=Sudán del Sur,ER=Eritrea,DJ=Yibuti,SO=Somalia,RW=Ruanda,BI=Burundi,MZ=Mozambique,ZM=Zambia,MW=Malaui,NA=Namibia,BW=Botsuana,LS=Lesoto,SZ=Esuatini,MU=Mauricio,CV=Cabo Verde,ST=Santo Tomé y Príncipe,KM=Comoras,SC=Seychelles,GM=Gambia",
"Oceanía":"*AU=Australia,*NZ=Nueva Zelanda,+FJ=Fiyi,+PG=Papúa Nueva Guinea,WS=Samoa,TO=Tonga,VU=Vanuatu,SB=Islas Salomón,KI=Kiribati,TV=Tuvalu,NR=Nauru,FM=Micronesia,MH=Islas Marshall,PW=Palaos"};
const P=[];
for(const r in D)D[r].split(",").forEach(s=>{const t=s[0]=="*"?1:s[0]=="+"?2:3;if(t<3)s=s.slice(1);const[c,n]=s.split("=");P.push({c,n,r,t})});
const L={
 facil:{nom:"Fácil",desc:"Países muy conocidos",max:1,reg:false,time:0},
 medio:{nom:"Medio",desc:"Más países, opciones de la misma zona",max:2,reg:true,time:0},
 dificil:{nom:"Difícil",desc:"Todos los países, misma zona y 10 s por bandera",max:3,reg:true,time:10}
};
const fl=c=>[...c].map(x=>String.fromCodePoint(127397+x.charCodeAt(0))).join("");
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const app=document.getElementById("app");
let rounds,i,score,locked,lv,tm,left;
const best={};
for(const k in L){try{best[k]=+localStorage.getItem("qb_best_"+k)||0}catch(e){best[k]=0}}

function home(){
  app.innerHTML=`<div style="font-size:4rem">🌍</div><h1>Quiz de banderas</h1><p>10 banderas, 3 opciones cada una.<br>Elige dificultad:</p><div class="opts">${Object.keys(L).map(k=>`<button data-k="${k}">${L[k].nom} · ${P.filter(p=>p.t<=L[k].max).length} países<small>${L[k].desc}${best[k]?` · Mejor: ${best[k]}/10`:""}</small></button>`).join("")}</div>`;
  app.querySelectorAll("button").forEach(b=>b.onclick=()=>start(b.dataset.k));
}
function start(k){
  lv=k;const cfg=L[k];
  const pool=P.filter(p=>p.t<=cfg.max);
  rounds=sh(pool).slice(0,10).map(c=>{
    let cand=sh(pool.filter(x=>x!==c&&(!cfg.reg||x.r==c.r)));
    if(cand.length<2)cand=cand.concat(sh(pool.filter(x=>x!==c&&!cand.includes(x))));
    return{c,opts:sh([c,...cand.slice(0,2)])};
  });
  i=0;score=0;show();
}
function reveal(pick){
  if(locked)return;locked=true;clearInterval(tm);
  const r=rounds[i],bs=[...app.querySelectorAll(".opts button")];
  if(pick>=0&&r.opts[pick]===r.c){score++;bs[pick].classList.add("ok")}
  else{if(pick>=0)bs[pick].classList.add("ko");bs[r.opts.indexOf(r.c)].classList.add("ok")}
  app.querySelector(".sc").textContent="⭐ "+score;
  const nx=document.getElementById("nx");nx.classList.remove("hide");
  nx.onclick=()=>{i++;i<10?show():end()};
}
function show(){
  locked=false;clearInterval(tm);const r=rounds[i],t=L[lv].time;
  app.innerHTML=`<div class="top"><span>Bandera ${i+1}/10</span>${t?`<span id="cd">⏱ ${t}</span>`:""}<span class="sc">⭐ ${score}</span></div><div class="bar"><i style="width:${i*10}%"></i></div><div class="flag">${fl(r.c.c)}</div><div class="opts">${r.opts.map((o,k)=>`<button data-k="${k}">${o.n}</button>`).join("")}</div><button class="main hide" id="nx">${i<9?"Siguiente":"Ver resultado"}</button>`;
  app.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>reveal(+b.dataset.k));
  if(t){left=t;tm=setInterval(()=>{left--;const cd=document.getElementById("cd");if(cd){cd.textContent="⏱ "+left;if(left<=3)cd.classList.add("late")}if(left<=0)reveal(-1)},1000)}
}
function end(){
  if(score>best[lv]){best[lv]=score;try{localStorage.setItem("qb_best_"+lv,score)}catch(e){}}
  const m=score==10?"¡Perfecto! 🏆":score>=7?"¡Muy bien! 🎉":score>=4?"No está mal 👍":"A seguir practicando 💪";
  app.innerHTML=`<p>Nivel ${L[lv].nom}</p><div class="big">${score}/10</div><h1>${m}</h1><p>Mejor marca: ${best[lv]}/10</p><button class="main" id="again">Otra tanda</button><button id="hm">Cambiar dificultad</button>`;
  document.getElementById("again").onclick=()=>start(lv);
  document.getElementById("hm").onclick=home;
}
home();
</script>
</body>
</html>
