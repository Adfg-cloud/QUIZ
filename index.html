<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz de banderas</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mut:#6b7488;--ac:#3b6cf6;--ok:#1f9d55;--okbg:#dcf5e6;--ko:#d93a3a;--kobg:#fbe0e0;--bd:#dde2ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151d;--card:#1c2130;--tx:#eef1f8;--mut:#98a2b8;--ac:#6b93ff;--ok:#4cd98a;--okbg:#17382a;--ko:#ff7b7b;--kobg:#3d1f22;--bd:#2b3247;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151d;--card:#1c2130;--tx:#eef1f8;--mut:#98a2b8;--ac:#6b93ff;--ok:#4cd98a;--okbg:#17382a;--ko:#ff7b7b;--kobg:#3d1f22;--bd:#2b3247;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:460px;padding:20px;display:flex;flex-direction:column;justify-content:center;gap:18px;text-align:center}
h1{margin:0;font-size:1.8rem}
p{margin:0;color:var(--mut)}
.flag{font-size:min(38vw,170px);line-height:1.1;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px 0;font-family:"Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",sans-serif}
.top{display:flex;justify-content:space-between;color:var(--mut);font-weight:600}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
button{font:inherit;font-size:1.1rem;font-weight:600;padding:16px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;width:100%}
button:active{transform:scale(.98)}
button.main{background:var(--ac);border-color:var(--ac);color:#fff}
button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
button.ko{background:var(--kobg);border-color:var(--ko);color:var(--ko)}
.opts{display:flex;flex-direction:column;gap:10px}
.big{font-size:4rem;font-weight:800;color:var(--ac)}
.hide{display:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
const P=[["ES","España"],["FR","Francia"],["DE","Alemania"],["IT","Italia"],["PT","Portugal"],["GB","Reino Unido"],["IE","Irlanda"],["NL","Países Bajos"],["BE","Bélgica"],["CH","Suiza"],["AT","Austria"],["SE","Suecia"],["NO","Noruega"],["DK","Dinamarca"],["FI","Finlandia"],["PL","Polonia"],["GR","Grecia"],["TR","Turquía"],["UA","Ucrania"],["RU","Rusia"],["US","Estados Unidos"],["CA","Canadá"],["MX","México"],["CU","Cuba"],["CO","Colombia"],["VE","Venezuela"],["PE","Perú"],["CL","Chile"],["AR","Argentina"],["BR","Brasil"],["UY","Uruguay"],["BO","Bolivia"],["EC","Ecuador"],["JP","Japón"],["CN","China"],["KR","Corea del Sur"],["IN","India"],["TH","Tailandia"],["VN","Vietnam"],["ID","Indonesia"],["AU","Australia"],["NZ","Nueva Zelanda"],["EG","Egipto"],["MA","Marruecos"],["ZA","Sudáfrica"],["NG","Nigeria"],["KE","Kenia"],["SA","Arabia Saudí"],["IL","Israel"],["IR","Irán"],["HU","Hungría"],["CZ","Chequia"],["RO","Rumanía"],["HR","Croacia"],["JM","Jamaica"],["PH","Filipinas"],["PK","Pakistán"],["DZ","Argelia"],["SN","Senegal"],["GH","Ghana"]];
const fl=c=>[...c].map(x=>String.fromCodePoint(127397+x.charCodeAt(0))).join("");
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const app=document.getElementById("app");
let rounds,i,score,locked;
let best=0;try{best=+localStorage.getItem("qb_best")||0}catch(e){}

function home(){
  app.innerHTML=`<div style="font-size:4rem">🌍</div><h1>Quiz de banderas</h1><p>10 banderas, 3 opciones cada una.<br>¿Cuántas aciertas?</p>${best?`<p>Tu mejor marca: <b>${best}/10</b></p>`:""}<button class="main" id="go">Empezar</button>`;
  document.getElementById("go").onclick=start;
}
function start(){
  rounds=sh(P).slice(0,10).map(c=>({c,opts:sh([c,...sh(P.filter(x=>x!==c)).slice(0,2)])}));
  i=0;score=0;show();
}
function show(){
  locked=false;const r=rounds[i];
  app.innerHTML=`<div class="top"><span>Bandera ${i+1}/10</span><span>⭐ ${score}</span></div><div class="bar"><i style="width:${i*10}%"></i></div><div class="flag">${fl(r.c[0])}</div><div class="opts">${r.opts.map((o,k)=>`<button data-k="${k}">${o[1]}</button>`).join("")}</div><button class="main hide" id="nx">${i<9?"Siguiente":"Ver resultado"}</button>`;
  const bs=[...app.querySelectorAll(".opts button")];
  bs.forEach(b=>b.onclick=()=>{
    if(locked)return;locked=true;
    const o=r.opts[+b.dataset.k];
    if(o===r.c){score++;b.classList.add("ok")}
    else{b.classList.add("ko");bs[r.opts.indexOf(r.c)].classList.add("ok")}
    app.querySelector(".top span:last-child").textContent="⭐ "+score;
    const nx=document.getElementById("nx");nx.classList.remove("hide");
    nx.onclick=()=>{i++;i<10?show():end()};
  });
}
function end(){
  if(score>best){best=score;try{localStorage.setItem("qb_best",best)}catch(e){}}
  const m=score==10?"¡Perfecto! 🏆":score>=7?"¡Muy bien! 🎉":score>=4?"No está mal 👍":"A seguir practicando 💪";
  app.innerHTML=`<p>Resultado</p><div class="big">${score}/10</div><h1>${m}</h1><p>Mejor marca: ${best}/10</p><button class="main" id="again">Otra tanda</button>`;
  document.getElementById("again").onclick=start;
}
home();
</script>
</body>
</html>
